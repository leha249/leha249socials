<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Discord Profile | MyLinks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --glass-bg: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.15);
    --glass-hover: rgba(255,255,255,0.12);
    --glass-active: rgba(255,255,255,0.18);
    --text-primary: rgba(255,255,255,0.95);
    --text-secondary: rgba(255,255,255,0.55);
    --accent: rgba(88, 101, 242, 0.9);
    --discord-blurple: #5865F2;
    --discord-glow: rgba(88, 101, 242, 0.4);
  }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0f;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(88, 101, 242, 0.2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(114, 137, 218, 0.25) 0%, transparent 55%),
      radial-gradient(ellipse 100% 80% at 50% 50%, rgba(10,10,30,0.8) 0%, #0a0a0f 100%);
  }

  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 {
    width: 300px; height: 300px;
    top: -80px; left: -60px;
    background: radial-gradient(circle, rgba(88,101,242,0.3) 0%, transparent 70%);
    animation: drift1 12s ease-in-out infinite;
  }
  .orb2 {
    width: 250px; height: 250px;
    bottom: 0; right: -50px;
    background: radial-gradient(circle, rgba(114,137,218,0.25) 0%, transparent 70%);
    animation: drift2 15s ease-in-out infinite;
  }
  .orb3 {
    width: 180px; height: 180px;
    top: 40%; left: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(88,101,242,0.2) 0%, transparent 70%);
    animation: drift3 9s ease-in-out infinite;
  }

  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,40px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,-30px)} }
  @keyframes drift3 { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-45%,-55%)} }

  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 0 16px 40px;
    max-width: 430px;
    margin: 0 auto;
  }

  /* — HEADER — */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 52px;
    padding-bottom: 32px;
  }

  .avatar-ring {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 18px;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #5865F2,
      #7289DA,
      #99AAB5,
      #5865F2,
      #7289DA
    );
    animation: spin 4s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #5865F2,
      #7289DA,
      #99AAB5,
      #5865F2,
      #7289DA
    );
    filter: blur(8px);
    opacity: 0.5;
    animation: spin 4s linear infinite;
  }

  .avatar {
    position: relative;
    z-index: 1;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2c2f6e 0%, #1a1c44 100%);
    border: 2px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 300;
    color: rgba(255,255,255,0.9);
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .username {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text-primary);
    margin-bottom: 5px;
  }

  .usertag {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }

  /* — GLASS SECTION — */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 0 4px 10px;
  }

  .glass-card {
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.15s ease;
    text-decoration: none;
    color: inherit;
    position: relative;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
  }

  .social-link:last-child { border-bottom: none; }

  .social-link:active { background: var(--glass-active); }

  .social-link::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    transition: opacity 0.2s;
  }

  .social-link:hover::after { opacity: 1; }

  .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .icon-wrap svg { width: 24px; height: 24px; }

  /* Discord стиль — чистая иконка */
  .icon-discord {
    background: #5865F2;
    background: linear-gradient(145deg, #5865F2, #4752C4);
    border: 0.5px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 12px rgba(88,101,242,0.3);
  }

  .icon-steam {
    background: linear-gradient(145deg, rgba(23,26,33,0.9), rgba(10,10,20,0.95));
    border: 0.5px solid rgba(102,192,244,0.3);
    box-shadow: 0 2px 12px rgba(102,192,244,0.15);
  }

  .icon-coming {
    background: linear-gradient(145deg, rgba(40,40,55,0.6), rgba(20,20,35,0.7));
    border: 0.5px solid rgba(255,255,255,0.08);
  }

  .link-info { flex: 1; min-width: 0; }

  .link-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .link-sub {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-arrow {
    color: rgba(255,255,255,0.2);
    flex-shrink: 0;
    transition: transform 0.2s, color 0.2s;
  }

  .social-link:active .link-arrow {
    transform: translateX(3px);
    color: rgba(255,255,255,0.5);
  }

  .badge-soon {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }

  /* — STATS ROW — */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 2px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .stat-num {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* — FOOTER — */
  .footer {
    text-align: center;
    padding-top: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.3px;
  }

  /* — RIPPLE — */
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .ripple-effect {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: ripple 0.5s ease-out forwards;
    pointer-events: none;
  }

  /* entrance animation */
  .glass-card, .stats-row { animation: fadeUp 0.5s ease both; }
  .glass-card:nth-of-type(2) { animation-delay: 0.05s; }
  .stats-row { animation-delay: 0.1s; }
  .header { animation: fadeUp 0.4s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<script>
  // Telegram Web App init
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const user = Telegram.WebApp.initDataUnsafe?.user;
    if (user) {
      const nameEl = document.getElementById('tg-name');
      const tagEl = document.getElementById('tg-tag');

      nameEl.textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Мой профиль';
      if (user.username) tagEl.textContent = '@' + user.username;

      const avatarEl = document.querySelector('.avatar');
      const initials = [user.first_name?.[0], user.last_name?.[0]].filter(Boolean).join('').toUpperCase();
      if (initials) avatarEl.textContent = initials;
    }
  }

  // Если хочешь поменять ссылку Discord — просто измени атрибут href у элемента с id="discord-link"
  // Например, раскомментируй строку ниже и вставь свою ссылку:
   document.getElementById('discord-link').href = 'https://discord.gg/MuqUvFz3FK';

  // Ripple effect on links
  document.querySelectorAll('.social-link[href]').forEach(link => {
    link.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const r = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      r.className = 'ripple-effect';
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px;`;
      this.appendChild(r);
      setTimeout(() => r.remove(), 600);
    });
  });
</script>
