<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Profile</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --glass-bg: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.15);
    --glass-hover: rgba(255,255,255,0.12);
    --glass-active: rgba(255,255,255,0.18);
    --text-primary: rgba(255,255,255,0.95);
    --text-secondary: rgba(255,255,255,0.55);
    --accent: rgba(120,180,255,0.9);
    --glow: rgba(100,160,255,0.3);
  }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0f;
    color: var(--text-primary);
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(40,60,120,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(20,30,80,0.6) 0%, transparent 55%),
      radial-gradient(ellipse 100% 80% at 50% 50%, rgba(10,10,30,0.8) 0%, #0a0a0f 100%);
  }

  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 {
    width: 300px; height: 300px;
    top: -80px; left: -60px;
    background: radial-gradient(circle, rgba(60,100,200,0.25) 0%, transparent 70%);
    animation: drift1 12s ease-in-out infinite;
  }
  .orb2 {
    width: 250px; height: 250px;
    bottom: 0; right: -50px;
    background: radial-gradient(circle, rgba(80,40,160,0.2) 0%, transparent 70%);
    animation: drift2 15s ease-in-out infinite;
  }
  .orb3 {
    width: 180px; height: 180px;
    top: 40%; left: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(30,80,180,0.15) 0%, transparent 70%);
    animation: drift3 9s ease-in-out infinite;
  }

  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,40px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,-30px)} }
  @keyframes drift3 { 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-45%,-55%)} }

  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 0 16px 40px;
    max-width: 430px;
    margin: 0 auto;
  }

  /* — HEADER — */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
    padding-bottom: 12px;
  }

  .avatar-ring {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 12px;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgba(100,160,255,0.8),
      rgba(160,100,255,0.6),
      rgba(100,200,255,0.8),
      rgba(80,140,255,0.9),
      rgba(100,160,255,0.8)
    );
    animation: spin 4s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-ring::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgba(100,160,255,0.8),
      rgba(160,100,255,0.6),
      rgba(100,200,255,0.8),
      rgba(80,140,255,0.9),
      rgba(100,160,255,0.8)
    );
    filter: blur(8px);
    opacity: 0.5;
    animation: spin 4s linear infinite;
  }

  .avatar {
    position: relative;
    z-index: 1;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a2a5e 0%, #0d1a3a 100%);
    border: 2px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 300;
    color: rgba(255,255,255,0.9);
    overflow: hidden;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .username {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text-primary);
    margin-bottom: 5px;
  }

  .usertag {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.2px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(100,200,120,0.12);
    border: 0.5px solid rgba(100,200,120,0.3);
    font-size: 12px;
    color: rgba(120,220,140,0.9);
    font-weight: 500;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(100,220,130,0.9);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.6; transform:scale(0.8); }
  }

  /* — GLASS SECTION — */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 0 4px 10px;
  }

  .glass-card {
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.15s ease;
    text-decoration: none;
    color: inherit;
    position: relative;
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
  }

  .social-link:last-child { border-bottom: none; }

  .social-link:active { background: var(--glass-active); }

  .social-link::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    transition: opacity 0.2s;
  }

  .social-link:hover::after { opacity: 1; }

  .icon-wrap {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .icon-wrap svg { width: 22px; height: 22px; }

  .icon-steam {
    background: linear-gradient(145deg, rgba(23,26,33,0.9), rgba(10,10,20,0.95));
    border: 0.5px solid rgba(102,192,244,0.3);
    box-shadow: 0 2px 12px rgba(102,192,244,0.15);
  }

  .icon-coming {
    background: linear-gradient(145deg, rgba(40,40,55,0.6), rgba(20,20,35,0.7));
    border: 0.5px solid rgba(255,255,255,0.08);
  }

  .link-info { flex: 1; min-width: 0; }

  .link-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .link-sub {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-arrow {
    color: rgba(255,255,255,0.2);
    flex-shrink: 0;
    transition: transform 0.2s, color 0.2s;
  }

  .social-link:active .link-arrow {
    transform: translateX(3px);
    color: rgba(255,255,255,0.5);
  }

  .badge-soon {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }

  /* — STEAM GLOW — */
  .icon-steam-glow {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: radial-gradient(circle at 50% 50%, rgba(102,192,244,0.1), transparent 70%);
    pointer-events: none;
  }

  /* — STATS ROW — */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--glass-bg);
    border: 0.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 2px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .stat-num {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* — FOOTER — */
  .footer {
    text-align: center;
    padding-top: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.3px;
  }

  /* — RIPPLE — */
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .ripple-effect {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: ripple 0.5s ease-out forwards;
    pointer-events: none;
  }

  /* entrance animation */
  .glass-card, .stats-row { animation: fadeUp 0.5s ease both; }
  .glass-card:nth-of-type(2) { animation-delay: 0.05s; }
  .stats-row { animation-delay: 0.1s; }
  .header { animation: fadeUp 0.4s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
